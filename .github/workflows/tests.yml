name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The pinned requirements (numpy 2.5, scipy 1.18) need Python >= 3.12
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        # OpenCV and Qt need libGL/libEGL; Qt's xcb plugin and pynput need
        # an X server, provided by Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0
          pip install -e . --no-deps

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: pytest
